services:
  db:
    image: postgres:16-alpine
    container_name: fingrow-db
    environment:
      POSTGRES_DB: fingrow
      POSTGRES_USER: fingrow
      POSTGRES_PASSWORD: fingrow
    ports:
      - "5432:5432"
    volumes:
      - fingrow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fingrow -d fingrow"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    image: adobe/s3mock:5.2.2
    container_name: fingrow-s3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: fingrow-receipts
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - fingrow-s3-data:/s3mockroot

  api:
    build:
      context: .
      dockerfile: src/FinGrow.Api/Dockerfile
    container_name: fingrow-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: "Host=db;Port=5432;Database=fingrow;Username=fingrow;Password=fingrow"
      AiService__BaseUrl: "http://ai:8000"
      AiService__ApiKey: "${API_KEY:-dev-ai-api-key}"
      Metrics__CompanyMinimumEmployees: "${METRICS_COMPANY_MINIMUM_EMPLOYEES:-3}"
      Metrics__DepartmentMinimumEmployees: "${METRICS_DEPARTMENT_MINIMUM_EMPLOYEES:-3}"
      Twilio__AccountSid: "${TWILIO_ACCOUNT_SID:-}"
      Twilio__AuthToken: "${TWILIO_AUTH_TOKEN:-}"
      Twilio__PublicBaseUrl: "${TWILIO_PUBLIC_BASE_URL:-}"
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN:-}"
      Telegram__WebhookSecret: "${TELEGRAM_WEBHOOK_SECRET:-}"
      Email__ResendApiKey: "${RESEND_API_KEY:-}"
      Email__RedirectAllTo: "${EMAIL_REDIRECT_ALL_TO:-delivered@resend.dev}"
      MercadoPago__ClientId: "${MERCADOPAGO_CLIENT_ID:-}"
      MercadoPago__ClientSecret: "${MERCADOPAGO_CLIENT_SECRET:-}"
      MercadoPago__RedirectUri: "${MERCADOPAGO_REDIRECT_URI:-}"
      MercadoPago__FrontendReturnUrl: "${MERCADOPAGO_FRONTEND_RETURN_URL:-http://localhost:3000/dashboard/settings}"
      Gmail__ClientId: "${GMAIL_CLIENT_ID:-}"
      Gmail__ClientSecret: "${GMAIL_CLIENT_SECRET:-}"
      Gmail__RedirectUri: "${GMAIL_REDIRECT_URI:-http://localhost:8080/api/integrations/gmail/oauth/callback}"
      Gmail__FrontendReturnUrl: "${GMAIL_FRONTEND_RETURN_URL:-http://localhost:3000/dashboard/settings}"
      PasswordReset__ResetUrl: "${PASSWORD_RESET_URL:-http://localhost:3000/recuperar-password/restablecer}"
      CompanyMonthlyReport__PanelUrl: "${COMPANY_MONTHLY_REPORT_PANEL_URL:-http://localhost:3000/dashboard/company}"
      TokenEncryption__Key: "${TOKEN_ENCRYPTION_KEY:-}"
      Jobs__ApiKey: "${JOBS_API_KEY:-dev-only-jobs-key-change-in-production}"
      Storage__ServiceUrl: "${STORAGE_SERVICE_URL:-http://s3:9090}"
      Storage__BucketName: "${STORAGE_BUCKET_NAME:-fingrow-receipts}"
      Storage__AccessKey: "${STORAGE_ACCESS_KEY:-fingrow}"
      Storage__SecretKey: "${STORAGE_SECRET_KEY:-fingrow-dev}"
      Storage__Region: "${STORAGE_REGION:-us-east-1}"
      Axiom__ApiToken: "${AXIOM_API_TOKEN:-}"
      Axiom__Dataset: "${AXIOM_DATASET:-}"
      Axiom__Domain: "${AXIOM_DOMAIN:-api.axiom.co}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Jwt__SecretKey: "dev-only-secret-key-change-in-production-32chars"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
      s3:
        condition: service_started

  ai:
    build:
      context: ../FinGrow-AI
    container_name: fingrow-ai
    env_file:
      - ../FinGrow-AI/.env
    environment:
      API_KEY: "${API_KEY:-dev-ai-api-key}"
    ports:
      - "8000:8000"

volumes:
  fingrow-db-data:
  fingrow-s3-data:
