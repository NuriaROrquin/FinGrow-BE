services:
  db:
    image: postgres:16-alpine
    container_name: fingrow-db
    environment:
      POSTGRES_DB: fingrow
      POSTGRES_USER: fingrow
      POSTGRES_PASSWORD: fingrow
    ports:
      - "5432:5432"
    volumes:
      - fingrow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fingrow -d fingrow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/FinGrow.Api/Dockerfile
    container_name: fingrow-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: "Host=db;Port=5432;Database=fingrow;Username=fingrow;Password=fingrow"
      AiService__BaseUrl: "http://ai:8000"
      # Secreto compartido con FinGrow-AI (variable API_KEY del otro lado). En local la IA
      # arranca con API_KEY vacia y no lo valida, por eso alcanza con un valor de relleno.
      AiService__ApiKey: "dev-ai-api-key"
      Twilio__AccountSid: "${TWILIO_ACCOUNT_SID:-}"
      Twilio__AuthToken: "${TWILIO_AUTH_TOKEN:-}"
      Twilio__PublicBaseUrl: "${TWILIO_PUBLIC_BASE_URL:-}"
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN:-}"
      Telegram__WebhookSecret: "${TELEGRAM_WEBHOOK_SECRET:-}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # El servicio de IA vive en el repo FinGrow-AI; se habilita cuando tenga Dockerfile.
  # ai:
  #   build:
  #     context: ../FinGrow-AI
  #   container_name: fingrow-ai
  #   ports:
  #     - "8000:8000"

volumes:
  fingrow-db-data:
