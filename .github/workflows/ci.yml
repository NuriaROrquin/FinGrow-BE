name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore FinGrow.sln

      - name: Compilar
        run: dotnet build FinGrow.sln --configuration Release --no-restore

      - name: Ejecutar tests
        run: dotnet test FinGrow.sln --configuration Release --no-build --verbosity normal
